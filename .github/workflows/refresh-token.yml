name: Threads 토큰 갱신

on:
  schedule:
    # 매달 29일 한국 시간 08:13 (UTC 28일 23:13). 토큰 유효기간이 60일이라 한 달에 한 번이면 충분
    - cron: "13 23 28 * *"
  workflow_dispatch:

permissions:
  contents: write   # 60일 동안 활동이 없으면 공개 저장소의 예약 실행이 꺼지므로, 매달 빈 커밋을 남긴다

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python refresh_token.py
        env:
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
      - name: 예약 실행이 꺼지지 않도록 활동 기록 남기기
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "월간 활동 기록 (예약 실행 유지용)"
          git push
