name: Threads 자동 게시

on:
  schedule:
    # 놓친 글 보충용: 목~일 한국 시간 07:07~23:37, 30분마다(매시 7분, 37분).
    # 정해진 타임 게시는 slot-post.yml이 한다. 둘은 같은 그룹이라 동시에 돌지 않는다.
    - cron: "7,37 22,23 * * 3,4,5,6"
    - cron: "7,37 0-14 * * 4,5,6,0"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "1 = 게시하지 않고 확인만"
        required: false
        default: "0"
      test_body:
        description: "테스트 글 본문 (입력하면 시트와 상관없이 이 글만 올림)"
        required: false
        default: ""
      test_reply:
        description: "테스트 댓글 (광고 태그가 붙음)"
        required: false
        default: ""

concurrency:
  group: threads-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python post.py
        env:
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
          SHEET_ID: 1u07Ux7xx6houiqwZBh_6gyMK2Z2BHCzQzF2S97sUS9c
          SHEET_NAME: 시트1
          MAX_PER_RUN: "2"
          DRY_RUN: ${{ github.event.inputs.dry_run || '0' }}
          TEST_BODY: ${{ github.event.inputs.test_body }}
          TEST_REPLY: ${{ github.event.inputs.test_reply }}
