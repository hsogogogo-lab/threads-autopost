name: record-views

on:
  schedule:
    - cron: "17 * * * *"   # 매시 17분 (게시 작업 7분·37분과 겹치지 않게)
  workflow_dispatch:

concurrency:
  group: sheet-writer-views
  cancel-in-progress: false

jobs:
  views:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests gspread
      - run: python scripts/record_views.py
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SA_JSON }}
          VIEWS_DELAY_HOURS: "30"
